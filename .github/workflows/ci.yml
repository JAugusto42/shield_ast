name: CI & Security Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run Unit Tests
        run: go test -v -cover ./...

      - name: Build Shield Binary
        run: go build -o shield cmd/shield/main.go

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shield-binary
          path: shield
          retention-days: 1

  security-scan:
    name: Dogfooding (Self-Scan)
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download built binary
        uses: actions/download-artifact@v4
        with:
          name: shield-binary

      - name: Make binary executable
        run: chmod +x shield

      - name: Run Shield AST on itself 🛡️
        # Usamos o modo JSON para não travar a esteira com a interface interativa (TUI)
        run: ./shield scan --path . --output=shield-report.json

      - name: Upload Security Report
        uses: actions/upload-artifact@v4
        with:
          name: shield-security-report
          path: shield-report.json
